- title: "Hedonic eating is controlled by dopamine neurons that oppose GLP-1R satiety"
  image: Pub_Sci.png
  description: Identifies a brainstem dopamine pathway (peri-locus coeruleus → VTADA) encoding food palatability.
    - Demonstrates that dopamine promotes hedonic eating despite satiety signals from GLP-1 receptors.
    - Provides mechanistic insight into how GLP-1R agonists suppress food cravings and promote weight loss.
    - Establishes a neural framework linking metabolic and reward-driven feeding behaviors.
  authors: Zhenggang Zhu, et al.
  link:
    url: "https://www.science.org"  # 具体 URL 需更新
    display: "Science (In Press)"
  highlight: 1

- title: "HCN1 channels in GABAergic amygdalar neurons underpin male-biased aggressive behaviors"
  image: HCN1_Aggression.png
  description: |
    - Demonstrates that HCN1 channels in GABAergic amygdalar neurons drive male-biased aggression.
    - Reveals that HCN1-mediated excitability enhances aggressive behaviors specifically in males.
    - Identifies sex-dependent neuromodulation of aggression circuits via ion channel activity.
    - Suggests a molecular target for regulating pathological aggression.
  authors: Kai Li*, Zhenggang Zhu*, et al. (*co-first authors)
  link:
    url: "https://doi.org/10.1101/2024.12.07.627305"
    display: "bioRxiv (2024)"
  highlight: 0

- title: "A hypothalamic-amygdala circuit underlying sexually dimorphic aggression"
  image: Pub_Neuron2.jpg
  description: Identifies a male-biased hypothalamic-amygdala circuit for aggression initiation.
    - Reveals sex-specific neural mechanisms regulating aggressive behaviors.
    - Demonstrates the role of hypothalamic projection neurons in mediating aggression.
    - Shows that inactivation of this circuit selectively reduces male aggression without affecting female aggression.
  authors: Zhenggang Zhu, Lu Miao, Kaiyuan Li, Qingqing Ma, Yan-qin Yu, Shumin Duan
  link:
    url: https://www.cell.com/neuron/abstract/S0896-6273(24)00457-4?_returnURL=https%3A%2F%2Flinkinghub.elsevier.com%2Fretrieve%2Fpii%2FS0896627324004574%3Fshowall%3Dtrue
    display: Neuron 116, 875-889.E6 (2024)
  highlight: 1

- title: "A substantia innominata-midbrain circuit controls a general aggressive response"
